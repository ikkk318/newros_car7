# 由 make_world_map.py 生成（用户 world666 场景）
# 点位分两类（kind）：
#   cargo = 搬货点：到达后由任务层调用 /agv/cargo 触发顶升 / 下降。
#           「X号货架」停在槽口外约 0.9 m、车头正对槽口（接近/对位点）；
#           「X号槽内」是钻进凵型槽、停在货物正下方的顶升点。
#   nav   = 导航点：只用来组成路线，单独 goto 到它不会触发搬货服务。
frame_id: map
waypoints:
  起始点: {x: 0.0, y: 0.0, yaw: 0.0, kind: cargo}

  # ---- 槽内顶升点（车钻进槽里，停在货物正下方）----
  1号槽内:
    x: 3.000
    y: 2.692
    yaw: 0.000
    kind: cargo
  2号槽内:
    x: -8.937
    y: -7.518
    yaw: -3.085
    kind: cargo
  3号槽内:
    x: 2.926
    y: -6.140
    yaw: 0.000
    kind: cargo
  4号槽内:
    x: -8.626
    y: 8.385
    yaw: 1.552
    kind: cargo
  5号槽内:
    x: -9.180
    y: -2.596
    yaw: -3.099
    kind: cargo

  # ---- 槽口对位点（车停在槽外，车头正对槽口）----
  1号货架:
    x: 1.630
    y: 2.660
    yaw: 0.000
    kind: cargo
  2号货架:
    x: -7.570
    y: -7.410
    yaw: -3.080
    kind: cargo
  3号货架:
    x: 1.560
    y: -6.170
    yaw: 0.000
    kind: cargo
  4号货架:
    x: -8.620
    y: 7.020
    yaw: 1.550
    kind: cargo
  5号货架:
    x: -7.810
    y: -2.510
    yaw: -3.100
    kind: cargo

  # ---- 导航点（供路线经过；不触发搬货）----
  1点:
    x: 0.000
    y: 0.000
    yaw: 0.000
    kind: nav
  2点:
    x: -7.000
    y: 2.400
    yaw: 0.000
    kind: nav
  3点:
    x: -3.500
    y: -3.300
    yaw: 0.000
    kind: nav
  4点:
    x: -0.100
    y: 5.000
    yaw: 0.000
    kind: nav
