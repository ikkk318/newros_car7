# 本文件的路线与地图绑定（路线由若干点位的位姿快照组成）
# 每条路线 = 按行进顺序排列的途经点（坐标是存点时的快照，改点位不影响已存路线）。
frame_id: map
routes:
  # 绕场地一圈的巡检路线，途经 4 个导航点后回到起点附近
  1号:
    points:
      - {name: 1点, x: 0.000, y: 0.000, yaw: 0.000}
      - {name: 2点, x: -7.000, y: 2.400, yaw: 0.000}
      - {name: 3点, x: -3.500, y: -3.300, yaw: 0.000}
      - {name: 4点, x: -0.100, y: 5.000, yaw: 0.000}
