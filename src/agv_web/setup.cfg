# ament_python 包的 setuptools 配置（ros2 pkg create 生成）
# ★ 这个文件不能省：没有它，entry_points 里的 console_scripts
#   会被装到 install/agv_web/bin/ 而不是 install/agv_web/lib/agv_web/，
#   于是 ros2 run / ros2 launch 会报
#     "libexec directory '.../lib/agv_web' does not exist"
#   因为 ROS 2 只在 lib/<包名>/ 下找可执行文件。
[develop]
script_dir=$base/lib/agv_web
[install]
install_scripts=$base/lib/agv_web
