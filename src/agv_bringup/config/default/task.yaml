# task.yaml —— 任务层公共默认参数（与硬件无关）
# ------------------------------------------------------------------
# 这些值对应 task_manager_node 的 ROS 参数；改这里不需要碰代码。
#
# ★ 关于 field_*（原先这里是"第二个判据"，已收敛）：
#   目标点能不能去，全项目只有**一个**判据——map_yaml 指的那张实测栅格地图
#   （见 agv_common/goal_check.py）：
#       图外 → 拒；压在障碍/墙上 → 拒；净空不足 robot_clearance → 拒。
#   下面四个 field_* 只在**没有地图**时才生效（纯逻辑测试、或 map_yaml 没注入），
#   属于兜底，不再是"独立的一套范围"。因此它们与实测地图保持一致，
#   免得出现"门卫放行、判据拒绝"这种同一坐标两种结论的情况。
#   实测 maps/world666map：594×762 @0.025 → x[-10.70, 4.15] y[-9.83, 9.22]。
field_min: -10.70            # 兜底范围 x 下界（m）＝实测地图左边界
field_max: 4.15              # 兜底范围 x 上界（m）＝实测地图右边界
field_min_y: -9.83           # 兜底范围 y 下界（m）＝实测地图下边界
field_max_y: 9.22            # 兜底范围 y 上界（m）＝实测地图上边界
waypoint_frame: map          # 点位/目标坐标系
nav_print_period: 1.0        # 导航反馈打印周期（s），避免刷屏
nav_timeout_s: 180.0         # 单段导航总超时（s）：超时取消并报错
cargo_timeout_s: 5.0         # 调搬货服务（/agv/cargo）的等待上限（s）
robot_clearance: 0.30        # 目标点所需净空（m）：车宽 0.5 → 半宽 0.26 + 余量
map_yaml: ""                 # 目标点判据用的地图 yaml；留空则退化为上面的兜底范围（由 launch 注入）
