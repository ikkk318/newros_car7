# waypoint.yaml —— 点位 / 路线管理公共默认参数
# ------------------------------------------------------------------
# 点位与路线都**跟地图绑定**：每份地图一个目录，里面放
#   <地图库>/<地图名>/waypoints.yaml   点位
#   <地图库>/<地图名>/routes.yaml      路线
# 由控制台"加载地图"时注入；这里的默认值只在没走控制台加载流程时兜底。
waypoint_file: /tmp/agv_waypoints.yaml   # 点位文件（控制台加载地图时会覆盖）
routes_file: /tmp/agv_routes.yaml        # 路线文件（控制台加载地图时会覆盖）
frame_id: map                            # 点位/路线坐标系
