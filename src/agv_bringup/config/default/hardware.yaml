# hardware.yaml —— 硬件抽象层参数（速度仲裁 / 反应式避障）
# ------------------------------------------------------------------
# 本文件只在 default 层；real 层可覆盖（阶段三接真实下位机时改这里）。
# 搬货机器的参数不在这里：搬货只有一个服务，参数见 agv_lift/agv_lift/cargo_node.py。

# ---- 速度仲裁 / 反应式避障（近障减速 + 左右择空 + 缓回导航）----
velocity_arbiter:
  ros__parameters:
    stop_distance: 0.30         # 距障 ≤ 此值(m)：直接刹停（防撞底线，勿动）
    slow_distance: 0.55         # 距障 ≤ 此值(m)：开始按比例减速
    take_over_distance: 0.45    # 距障 ≤ 此值(m) 且低速：进入"择向接管"
    takeover_max_speed: 0.25    # 进入接管所需的车速上限(m/s)
    slow_min_speed: 0.10        # 减速过渡段的最小线速度(m/s)
    front_half_angle_deg: 45.0  # 前方扇区半张角（度）：用于"近障减速"，保持宽覆盖
    side_max_angle_deg: 90.0    # 侧方统计到该角度为止（度）
    takeover_half_angle_deg: 20.0  # 接管闸门锥半张角（度）：只管"要不要夺向"这一个判断
                                # ★ 别开大：前锥 45° 的边界会扫到平行于车身的槽侧壁
                                #   （槽内净半宽 0.361、车半宽 0.25 → 车心最多偏 0.111，
                                #   近侧壁距车心 0.250；45° 射线命中 0.354 ≤ take 0.45）
                                #   → 闸门被骗开、车在槽内被反复夺向。
                                #   解析临界 h > asin(0.250/0.55)=27.0°，实测临界 30~35°，
                                #   取 20° 留余量。实测 ±45° 时进槽 36%~47% 被夺向，20° 为 0。
    rear_half_angle_deg: 20.0   # 后方扇区半张角（度）：倒车时按此窄锥看车尾
                                # ★ 别开大：槽内净宽 0.722，车心离侧壁仅 0.361；
                                #   实测后方锥 ±20° 最小 1.20 m（干净），±25° 就降到
                                #   0.54 m（擦到槽侧壁、触发减速），会拖慢甚至卡死倒车。
    yaw_handback_rate: 0.30     # 远离障碍后角速度交还导航的步长(rad/s/次)
    max_linear: 0.5             # 最终线速度上限(m/s)
    max_angular: 1.0            # 最终角速度上限(rad/s)
    scan_topic: /scan
    cmd_in: /cmd_vel            # 订阅 Nav2/任务层的最终速度
    cmd_out: /cmd_vel_raw       # 发给底盘（Gazebo 差速插件 / 实车下位机）
    cmd_timeout: 0.5            # 上层速度超时(s)：超时即输出零速（防止最后一条速度被无限重发）
    scan_timeout: 0.5           # 激光超时(s)：超时则原样放行（只限幅）
    publish_rate: 20.0          # 仲裁输出频率(Hz)：按此频率重发，保证减速/刹停持续生效
