# 里程计参数 —— 实测标定值（占位）
# ==================================================================
# 本文件里的值都是【占位】，装好实物后必须实测替换。
#
# 与理想值（odom_calib_sim.yaml）最大的差别就在这两行：
#   wheel_radius     —— 轮子受压会变小，标称 50 mm 实测常是 48.5~49.5
#   wheel_separation —— 轮子有倾角/装配误差，标称 440 实测常差 2~5 mm
# 这两个数错 1%，走 10 m 就偏 100 mm。所以必须做「走直线 + 原地转」标定。
# ==================================================================

agv_real_odom_calib:
  ros__parameters:
    # ---- 几何参数（★ 必须实测，不要直接抄标称值）----
    wheel_radius: 0.050        # [m]  ★ 实测：满载状态下量轮子直径 / 2
    wheel_separation: 0.440    # [m]  ★ 实测：原地转 10 圈反算

    # ---- 编码器（★ 按实际电机填）----
    # 常见组合：霍尔编码器 13 PPR × 4 倍频 × 减速比 30 = 1560
    ticks_per_rev: 1560
    gear_ratio: 30.0

    # ---- 里程计发布 ----
    publish_frequency: 50.0
    odom_frame: odom
    base_frame: base_footprint

    # ---- 标定记录（做完实验填回来）----
    # 标定日期:      YYYY-MM-DD
    # 直线 5 m 误差:   __ %
    # 原地 10 圈误差:  __ °
